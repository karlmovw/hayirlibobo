<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel - Hayirli Bobo Masjidi</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --sariq: #F5A623;
      --sariq-dark: #D4890A;
      --navy: #1E2A4A;
      --navy-light: #2D3F6B;
      --white: #FFFFFF;
      --dark: #0F1623;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Dekorativ fon */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(245,166,35,0.08) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      border-radius: 50%;
    }

    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(30,42,74,0.6) 0%, transparent 70%);
      bottom: -50px;
      left: -50px;
      border-radius: 50%;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
      position: relative;
      z-index: 10;
    }

    .login-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(245,166,35,0.2);
      border-radius: 24px;
      padding: 48px 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-logo .logo-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--sariq), var(--sariq-dark));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 32px rgba(245,166,35,0.3);
    }

    .login-logo h1 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--white);
      margin-bottom: 4px;
    }

    .login-logo p {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
    }

    .login-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--sariq);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--white);
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: all 0.3s;
    }

    .form-group input:focus {
      border-color: var(--sariq);
      background: rgba(245,166,35,0.06);
      box-shadow: 0 0 0 3px rgba(245,166,35,0.1);
    }

    .form-group input::placeholder {
      color: rgba(255,255,255,0.2);
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--sariq), var(--sariq-dark));
      color: var(--navy);
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.3s;
      box-shadow: 0 8px 24px rgba(245,166,35,0.3);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(245,166,35,0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-msg {
      display: none;
      background: rgba(255,80,80,0.1);
      border: 1px solid rgba(255,80,80,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      color: #ff6b6b;
      font-size: 13px;
      text-align: center;
      margin-top: 16px;
    }

    .error-msg.show { display: block; }

    .back-link {
      text-align: center;
      margin-top: 24px;
    }

    .back-link a {
      color: rgba(255,255,255,0.3);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link a:hover { color: var(--sariq); }

    /* Islomiy naqsh */
    .pattern {
      position: absolute;
      width: 200px;
      height: 200px;
      opacity: 0.03;
      bottom: 40px;
      right: 40px;
      font-size: 180px;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="pattern">🕌</div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">🕌</div>
        <h1>Hayirli Bobo Masjidi</h1>
        <p>Boshqaruv paneli</p>
      </div>

      <p class="login-title">Admin Kirish</p>

      <div class="form-group">
        <label>Login</label>
        <input type="text" id="loginInput" placeholder="Admin loginini kiriting"/>
      </div>

      <div class="form-group">
        <label>Parol</label>
        <input type="password" id="passwordInput" placeholder="Parolni kiriting"
          onkeydown="if(event.key==='Enter') adminKirish()"/>
      </div>

      <button class="login-btn" onclick="adminKirish()">Kirish →</button>

      <div class="error-msg" id="errorMsg">
        ❌ Login yoki parol noto'g'ri!
      </div>

      <div class="back-link">
        <a href="../Frontend/index.html">← Asosiy saytga qaytish</a>
      </div>
    </div>
  </div>

  <script>
    // Login ma'lumotlari - keyinchalik backend bilan almashtiriladi
    const ADMIN_LOGIN = 'admin';
    const ADMIN_PAROL = 'hayirlibobo2024';

    function adminKirish() {
      const login = document.getElementById('loginInput').value.trim();
      const parol = document.getElementById('passwordInput').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      if (login === ADMIN_LOGIN && parol === ADMIN_PAROL) {
        // Sessiyaga saqla
        sessionStorage.setItem('adminKirdi', 'true');
        // Dashboard ga o'tish
        window.location.href = 'dashboard.html';
      } else {
        errorMsg.classList.add('show');
        setTimeout(() => errorMsg.classList.remove('show'), 3000);
      }
    }

    // Agar admin allaqachon kirgan bo'lsa
    if (sessionStorage.getItem('adminKirdi') === 'true') {
      window.location.href = 'dashboard.html';
    }
  </script>

</body>
</html>
